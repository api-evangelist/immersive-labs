aid: immersive-labs
name: Immersive Labs
description: >-
  Immersive Labs (now branded "Immersive") is a cyber resilience platform — "the
  cyber proving ground for the AI enterprise" — that lets organizations continuously
  prove and improve the cyber readiness of their workforce, security teams, AI agents,
  and leadership through hands-on labs, realistic drills, and crisis-simulation
  exercises. Trusted by more than 30% of Fortune 100 companies, the platform measures
  human and organizational cyber capability across people, process, and technology.
  Its APIs let customers export achievements, assignable content, labs, collections,
  cyber roles, and workforce-scenario data into their own reporting, SIEM, and
  workforce-analytics systems. The current V1 API is GraphQL (with a legacy GraphQL
  surface being retired in favor of an actively enhanced V2), authenticated with an
  API access key and secret token exchanged for a short-lived bearer access token.
